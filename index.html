<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RoadToGoal</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RoadToGoal" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hover the left edge to peek this out; it sits above the road and "Мои цели" alike -->
  <nav id="navRail" class="nav-rail">
    <button type="button" class="goals-nav-btn" data-nav="road">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 16c1.5-5 3-7.5 5-9s4.5-1.5 5.5 1.5" opacity=".85"/>
        <circle cx="3.5" cy="16" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="14.3" cy="8" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <span>Дорожка</span>
    </button>
    <button type="button" class="goals-nav-btn" data-nav="goals">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h12M7 10h9M7 15h9"/><path d="M4 5v10M4 10h1.5M4 15h1.5" opacity=".55"/>
      </svg>
      <span>Цели</span>
    </button>
    <button type="button" class="goals-nav-btn" data-nav="plan">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="14" height="12" rx="2.2"/><path d="M3 8.3h14M7 2.5v3M13 2.5v3"/>
        <path d="M6.6 11.3h1.3M9.35 11.3h1.3M12.1 11.3h1.3M6.6 13.7h1.3" opacity=".6"/>
      </svg>
      <span>Планирование</span>
      <i id="planNavDot" class="goals-nav-dot" hidden></i>
    </button>
    <div class="nav-hint">Панель выезжает, когда курсор у левого края</div>
    <!-- the tab that makes the hidden panel findable at all -->
    <button type="button" id="navHandle" class="nav-handle" title="Открыть панель">
      <!-- a curve rather than two straight strokes: no corner to catch the eye -->
      <svg viewBox="0 0 8 14" width="8" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M2.7 3.4 Q6 7 2.7 10.6" />
      </svg>
    </button>
  </nav>

  <!-- a constant, quiet reminder of how much of today is actually left -->
  <div id="dayClock" class="day-clock" title="Сколько осталось до конца дня">
    <div class="day-clock-time"></div>
    <div class="day-clock-left"></div>
  </div>

  <header class="topbar">
    <div class="goal-label">Главная цель</div>
    <input id="mainGoalInput" class="goal-title" type="text" placeholder="Назовите цель" />
    <div class="meta-line">
      <div class="chip progress-chip">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <span id="progressText" class="progress-count"><b>0</b>из 0</span>
      </div>
      <div id="goalDeadline" class="meta-row"></div>
    </div>
  </header>

  <section id="whyStrip" class="why-hero"></section>

  <div class="road-area">
    <div class="road-fade left"></div>
    <div class="road-fade right"></div>
  <main class="road-wrap">
    <div id="roadEmpty" class="road-empty" hidden>Добавь первый шаг к цели — строка внизу ↓</div>
    <div id="nodesLayer" class="nodes-layer">
      <svg id="roadSvg" class="road-svg"></svg>
    </div>
  </main>
  </div>

  <section id="today" class="today"></section>

  <section class="quote-wrap">
    <div class="quote-label">Фраза дня</div>
    <p id="quote" class="quote"></p>
  </section>

  <footer class="add-panel">
    <form id="addForm" class="add-form" autocomplete="off">
      <input id="newTitle" type="text" placeholder="Новый шаг к цели" />
      <button type="button" id="whereBtn" class="where-btn" title="Куда поставить новый шаг">перед финишем</button>
      <button type="button" id="iconBtn" class="icon-btn" title="Выбрать иконку" aria-haspopup="true">🎯</button>
      <button type="submit" class="submit-btn">Добавить</button>
      <div id="iconPicker" class="icon-picker" role="dialog" aria-label="Выбор иконки"></div>
      <div id="whereMenu" class="where-menu" role="menu">
        <div class="wm-title">Куда поставить новый шаг</div>
        <button type="button" data-where="start">
          <span class="wm-text"><b>Следующим шагом</b><span>сразу после пройденных</span></span>
          <span class="wm-road"><i class="d"></i><i class="d"></i><i class="n"></i><i></i><i></i><i class="f"></i></span>
        </button>
        <button type="button" data-where="end" class="on">
          <span class="wm-text"><b>Перед финишем</b><span>обычный шаг в конец пути</span></span>
          <span class="wm-road"><i class="d"></i><i class="d"></i><i></i><i></i><i class="n"></i><i class="f"></i></span>
        </button>
        <button type="button" data-where="finish">
          <span class="wm-text"><b>Сделать финишем</b><span>сама цель, последний шаг</span></span>
          <span class="wm-road"><i class="d"></i><i class="d"></i><i></i><i></i><i></i><i class="n"></i></span>
        </button>
        <div class="wm-legend"><span><i class="d"></i>пройден</span><span><i></i>впереди</span><span><i class="n"></i>новый шаг</span></div>
      </div>
    </form>
  </footer>

  <div id="greetScreen" class="overlay greet-overlay"><div class="greet-card"></div></div>
  <div id="wizard" class="overlay"><div class="wiz-card"></div></div>
  <div id="welcomeBack" class="overlay"><div class="back-card"></div></div>
  <div id="confirmUndo" class="overlay"><div class="confirm-card"></div></div>
  <div id="weeklyReview" class="overlay"><div class="review-card"></div></div>
  <div id="stepCard" class="drawer"><div class="step-panel"></div></div>
  <div id="goalsView" class="goals-view"><div class="goals-panel"></div></div>

  <div id="imageView" class="overlay img-view">
    <button type="button" class="wiz-close" title="Закрыть">✕</button>
    <img src="" alt="" />
  </div>

  <script src="dayclock.js"></script>
  <script src="quotes.js"></script>
  <script src="sound.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="goalplan.js"></script>
  <script src="habit.js"></script>
  <script src="stepcard.js"></script>
  <script src="graph.js"></script>
  <script src="goals.js"></script>
  <script src="agenda.js"></script>
  <script src="sync.js"></script>
  <script>
    // installed on a phone: lets the app open without a connection (the Windows app has no use for it)
    if (!IN_DESKTOP && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
